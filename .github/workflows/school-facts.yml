name: Apply school facts
# Pushes quote-verified facts from data/schools/facts to the providers table (import_provider_facts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/schools/facts/**"]
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      STAYLONG_IMPORT_TOKEN: ${{ secrets.STAYLONG_IMPORT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/apify/check-facts.ts
      - run: pnpm tsx scripts/apify/apply-facts.ts
